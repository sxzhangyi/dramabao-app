name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Regenerate Android project
        run: |
          # Remove old android dir
          rm -rf android
          # Create a temp flutter project just to get android dir
          cd /tmp
          flutter create --org com.dramabao --project-name dramabao_app temp_app
          # Copy android dir back
          cp -r /tmp/temp_app/android $GITHUB_WORKSPACE/android
          # Remove temp
          rm -rf /tmp/temp_app

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dramabao-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
