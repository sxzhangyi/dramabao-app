name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Create Android project
        run: |
          cd $GITHUB_WORKSPACE
          # Backup lib and pubspec
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup
          cp analysis_options.yaml /tmp/analysis_backup 2>/dev/null || true
          # Create a fresh Flutter project to get correct Android files
          cd /tmp
          flutter create --org com.dramabao --project-name dramabao_app temp_project
          # Replace our lib and pubspec back
          cp -r /tmp/lib_backup /tmp/temp_project/lib
          cp /tmp/pubspec_backup /tmp/temp_project/pubspec.yaml
          cp /tmp/analysis_backup /tmp/temp_project/analysis_options.yaml 2>/dev/null || true
          # Copy the correct Android files back
          rm -rf $GITHUB_WORKSPACE/android
          cp -r /tmp/temp_project/android $GITHUB_WORKSPACE/android
          # Copy pubspec.lock if exists
          cp /tmp/temp_project/pubspec.lock $GITHUB_WORKSPACE/pubspec.lock 2>/dev/null || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dramabao-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
