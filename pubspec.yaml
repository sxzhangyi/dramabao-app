name: dramabao_app
description: 剧宝 - 微短剧聚合播放APP
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  go_router: ^14.2.0
  flutter_screenutil: ^5.9.3
  carousel_slider: ^5.0.0
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo/
    - assets/images/banner/
    - assets/images/placeholder/
    - assets/images/icons/
